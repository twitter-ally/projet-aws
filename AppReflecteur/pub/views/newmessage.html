<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>New message </title>
         <link rel="stylesheet" href="/client.css">
    </head>
    <body>
   <!--  Lorsque l’utilisateur clique sur le menu pour composer un message,
     un formulaire est affiché demandant de saisir du texte.
     Le nom d’utilisateur et le mot de passe sont récupérés depuis le local storage, 
     puis l’ensemble est envoyé à /post.
      Un message est ensuite affiché indiquant si l’action a réussi ou non --> 
    <!-- nav créée automatiquement par le client -->
        <form id="newMsgForm">
            <div>
                <textarea id= "message" name="message" rows="4" cols="30" maxlength="400" placeholder="What are you thinking ? Share with us "></textarea>
            </div>
            <div>
                <button>Send</button>
            </div>
        </form>
    </body>
</html>
